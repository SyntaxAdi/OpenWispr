# ponytail: native gh CLI over third-party marketplace release actions
name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional tag override'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Compile Release APK
        run: ./gradlew assembleRelease --no-daemon --build-cache

      - name: Package Release Asset & Generate Notes
        id: prep
        run: |
          COUNT=$(git rev-list --count HEAD)
          MAJOR=$((COUNT / 100))
          MINOR=$(((COUNT / 10) % 10))
          PATCH=$((COUNT % 10))
          CALC_VER="${MAJOR}.${MINOR}.${PATCH}"
          TAG="${{ github.event.inputs.tag_name }}"
          if [[ -z "$TAG" ]]; then
            REF="${{ github.ref_name }}"
            if [[ "$REF" == v* ]]; then
              TAG="$REF"
            else
              TAG="v${CALC_VER}"
            fi
          fi
          SRC_APK="app/build/outputs/apk/release/app-release.apk"
          DEST_APK="OpenWispr-${TAG}.apk"
          cp "$SRC_APK" "$DEST_APK"
          SHA256=$(sha256sum "$DEST_APK" | awk '{print $1}')
          SIZE=$(du -h "$DEST_APK" | cut -f1)

          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n 1 || echo "")
          COMMITS=""
          if [[ -n "$PREV_TAG" ]]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s (\`%h\`)")
          fi
          if [[ -z "$COMMITS" ]]; then
            COMMITS=$(git log -n 5 --no-merges --pretty=format:"- %s (\`%h\`)")
          fi

          cat <<EOF | sed 's/^          //' > release_notes.md
          # OpenWispr ${TAG} — Real-Time Translation & Persona Styling

          A faster, more natural voice dictation experience for Android. Powered by Groq Whisper Large v3 Turbo, with multilingual translation and a minimal Nothing OS-inspired interface.

          ---

          ### What's New in ${TAG}

          ${COMMITS}

          ---

          ### Installation & Sideloading

          OpenWispr uses Android Accessibility Services to insert dictated text directly into compatible apps without relying on the clipboard.

          If Play Protect displays a warning during sideloading:
          1. Open **Google Play Store** -> Profile -> **Play Protect**.
          2. Tap the **Gear Icon (Settings)** in top right.
          3. Temporarily turn off **"Scan apps with Play Protect"**, install the APK, and re-enable scanning.

          ---

          ### APK Verification

          | Property | Value |
          |---|---|
          | File | \`${DEST_APK}\` |
          | Size | ~${SIZE} |
          | SHA-256 | \`${SHA256}\` |

          **Full Changelog:** https://github.com/${{ github.repository }}/commits/${TAG}
          EOF

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$DEST_APK" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.prep.outputs.tag }}"
          APK="${{ steps.prep.outputs.apk }}"
          gh release create "$TAG" "$APK" \
            --title "OpenWispr $TAG" \
            --notes-file release_notes.md \
            --verify-tag=false || {
            gh release edit "$TAG" --title "OpenWispr $TAG" --notes-file release_notes.md
            gh release upload "$TAG" "$APK" --clobber
          }
